version: "3.9"

services:
  ollama: 
   
    image: ollama/ollama:latest
   
    ports:
      - "11434:11434"
   
    volumes:
      - ollama_models:/root/.ollama
   
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

    deploy:  
      replicas: 1
      restart_policy:
        condition: on-failure

    networks:
      - agent-network
  

  app:
    image: ${DOCKER_REGISTRY}/post_creator:${IMAGE_TAG}
   
    ports:
      - "8000:8000"
    
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OUTPUT_DIR: /app/output
    
    volumes:
      - ./output:/app/output

    deploy:
      replicas: 2
      
      update_config:
        parallelism: 1
        delay: 10s

      rollback_config:
        parallelism: 1
        delay: 5s  

      restart_policy:
        condition: on-failure   

      networks:
        - agent-network  


volumes:
  ollama_models:
    driver: local
  output:
    driver: local

networks:
  agent-network:
    driver: overlay    



