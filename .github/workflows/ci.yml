name: CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  IMAGE_TAG: pr-${{ github.event.pull_request.number }}
  DOCKER_IMAGE: ${{ vars.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ vars.APP_NAME }}

jobs:

  test:

    runs-on: ubuntu-latest

    steps:
      - name : Checkout code
        uses: actions/checkout@v4
   
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
         version: "latest"
         enable-cache: true
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      
      - name : Install dependencies
        run: |
           uv sync --locked

      - name: Run tests
        run: |
          uv run pytest

  docker:
    
    name: Build And Push Docker Image

    needs: test
    
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile
        push: true
        tags: |
          ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          ${{ env.DOCKER_IMAGE }}:latest     
